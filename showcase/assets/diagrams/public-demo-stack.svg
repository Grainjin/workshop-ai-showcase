<svg xmlns="http://www.w3.org/2000/svg" width="480" height="670" viewBox="0 0 480 670" role="img" aria-labelledby="public-title public-description">
  <title id="public-title">轻量公开模式架构图</title>
  <desc id="public-description">Case Study 为静态产品说明。Expo Web 通过 FastAPI Public Demo API 使用 PostgreSQL 数据库评价上下文、服务端 LLM API 与 Demo Payment Adapter 模拟支付。公开部署与浏览器路径仍需验收。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8edaca"/></marker></defs>
  <rect width="480" height="670" rx="12" fill="#152237"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" fill="#edf3fb">
    <text x="240" y="38" font-size="24" font-weight="650">轻量公开模式 · 部署待完成</text>
    <g fill="#0d1624" stroke="#35465e" stroke-width="2">
      <rect x="60" y="60" width="360" height="70" rx="8" stroke-dasharray="6 4"/>
      <rect x="60" y="155" width="360" height="60" rx="8"/>
      <rect x="60" y="250" width="360" height="60" rx="8"/>
      <rect x="60" y="350" width="360" height="80" rx="8"/>
      <rect x="60" y="460" width="360" height="60" rx="8"/>
      <rect x="60" y="550" width="360" height="80" rx="8"/>
    </g>
    <g font-size="22">
      <text x="240" y="90">Case Study</text>
      <text x="240" y="119" font-size="20">静态说明 · 产品入口</text>
      <text x="240" y="193">Expo Web</text>
      <text x="240" y="288">FastAPI Public Demo API</text>
      <text x="240" y="382">PostgreSQL</text>
      <text x="240" y="413">数据库评价上下文</text>
      <text x="240" y="498">服务端 LLM API</text>
      <text x="240" y="583">Demo Payment Adapter</text>
      <text x="240" y="614" font-size="20">模拟支付 · 不产生真实扣款</text>
    </g>
    <text x="240" y="654" font-size="18" fill="#b5c4d8">评价信息与交易状态均保留核对边界</text>
  </g>
  <g fill="none" stroke="#8edaca" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 215 V250"/>
    <path d="M60 280 H30 V390 H60"/>
    <path d="M30 390 V490 H60"/>
    <path d="M30 490 V590 H60"/>
  </g>
</svg>
