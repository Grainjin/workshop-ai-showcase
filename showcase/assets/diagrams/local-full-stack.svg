<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="local-title local-description">
  <title id="local-title">完整本地模式架构图</title>
  <desc id="local-description">Expo Web 与 Mobile 通过 FastAPI 连接 PostgreSQL 和可配置 LLM，并按需使用 Redis 缓存、Celery 后台任务、Milvus 向量检索及 TEI 嵌入服务。etcd 与 MinIO 支持 Milvus 运行。完整启动需配置这些服务。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8edaca"/></marker></defs>
  <rect width="480" height="620" rx="12" fill="#152237"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" fill="#edf3fb">
    <text x="240" y="38" font-size="24" font-weight="650">完整本地模式</text>
    <g fill="#0d1624" stroke="#35465e" stroke-width="2">
      <rect x="60" y="60" width="360" height="60" rx="8"/>
      <rect x="60" y="155" width="360" height="60" rx="8"/>
      <rect x="60" y="260" width="360" height="80" rx="8"/>
      <rect x="60" y="375" width="360" height="80" rx="8"/>
      <rect x="60" y="490" width="360" height="100" rx="8"/>
    </g>
    <g font-size="22">
      <text x="240" y="98">Expo Web / Mobile</text>
      <text x="240" y="193">FastAPI · 业务与 AI 工具</text>
      <text x="240" y="292">PostgreSQL · 业务数据</text>
      <text x="240" y="323">可配置 LLM · 生成与工具调用</text>
      <text x="240" y="407">Redis · 缓存与任务支持</text>
      <text x="240" y="438">Celery · 后台任务</text>
      <text x="240" y="520">Milvus · 向量检索</text>
      <text x="240" y="551">etcd / MinIO · 检索依赖</text>
      <text x="240" y="580">TEI / Qwen3 Embedding</text>
    </g>
  </g>
  <g fill="none" stroke="#8edaca" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 120 V155"/>
    <path d="M60 185 H30 V300 H60"/>
    <path d="M30 300 V415 H60"/>
    <path d="M30 415 V540 H60"/>
  </g>
</svg>
