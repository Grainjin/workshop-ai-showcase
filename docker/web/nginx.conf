upstream workshop_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;

    location /ws/ {
        proxy_pass http://workshop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://workshop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://workshop_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://workshop_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://workshop_api;
        proxy_set_header Host $host;
    }

    location ~ ^/(auth|login|register|token|refresh-token|logout|social-login|me|health|ai|admin|customer|provider|providers|places|locations|verification-files|bookings|reviews|notifications|chats|payments|refund-requests)(/|$) {
        proxy_pass http://workshop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
